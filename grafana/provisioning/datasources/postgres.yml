apiVersion: 1
datasources:
  - name: T.I.A. Central
    uid: tia-pg
    type: grafana-postgresql-datasource
    url: db:5432
    user: grafana_ro
    isDefault: true
    editable: false
    jsonData:
      database: tia
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    secureJsonData:
      password: $GRAFANA_RO_PASSWORD
